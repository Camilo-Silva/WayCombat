<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="card-header">
      <h2>Restablecer Contraseña</h2>
      <p class="subtitle">Ingresa tu nueva contraseña</p>
    </div>

    <div class="card-body">
      <!-- Mensaje de éxito -->
      <div *ngIf="successMessage" class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        {{ successMessage }}
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        {{ errorMessage }}
      </div>

      <!-- Formulario -->
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
        <!-- Nueva Contraseña -->
        <div class="form-group">
          <label for="password">Nueva Contraseña</label>
          <div class="input-group">
            <span class="input-icon">
              <i class="fas fa-lock"></i>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="form-control"
              [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
              placeholder="Mínimo 6 caracteres"
            />
            <button
              type="button"
              class="btn-toggle-password"
              (click)="togglePasswordVisibility('password')"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div
            class="invalid-feedback"
            *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
          >
            <span *ngIf="resetForm.get('password')?.errors?.['required']">
              La contraseña es requerida
            </span>
            <span *ngIf="resetForm.get('password')?.errors?.['minlength']">
              La contraseña debe tener al menos 6 caracteres
            </span>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <div class="input-group">
            <span class="input-icon">
              <i class="fas fa-lock"></i>
            </span>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              class="form-control"
              [class.is-invalid]="(resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched) || (resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched)"
              placeholder="Confirma tu nueva contraseña"
            />
            <button
              type="button"
              class="btn-toggle-password"
              (click)="togglePasswordVisibility('confirmPassword')"
            >
              <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div
            class="invalid-feedback"
            *ngIf="resetForm.get('confirmPassword')?.invalid && resetForm.get('confirmPassword')?.touched"
          >
            <span *ngIf="resetForm.get('confirmPassword')?.errors?.['required']">
              Debes confirmar tu contraseña
            </span>
          </div>
          <div
            class="invalid-feedback"
            *ngIf="resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched"
          >
            Las contraseñas no coinciden
          </div>
        </div>

        <!-- Botones -->
        <div class="form-actions">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="isLoading || resetForm.invalid"
          >
            <span *ngIf="!isLoading">
              <i class="fas fa-check"></i>
              Actualizar Contraseña
            </span>
            <span *ngIf="isLoading">
              <i class="fas fa-spinner fa-spin"></i>
              Actualizando...
            </span>
          </button>

          <button
            type="button"
            class="btn btn-secondary"
            (click)="cancelReset()"
            [disabled]="isLoading"
          >
            <i class="fas fa-times"></i>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
